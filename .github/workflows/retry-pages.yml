name: Retry GitHub Pages deployment

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  retry:
    # A rerun emits another workflow_run event; only the initial attempt may retry.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Retry failed deployment once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          sleep 60
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
